name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
            echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          swift --version

      - name: Run tests
        run: Scripts/test.sh

      - name: Test Chrome extension logic
        run: node Scripts/test-chrome-extension.cjs

      - name: Build and test Chrome native helper
        run: |
          mkdir -p Build/ChromeExtension
          xcrun swiftc -O ChromeExtension/native-host.swift -o Build/ChromeExtension/research-library-chrome-host
          python3 Scripts/test-chrome-host.py
